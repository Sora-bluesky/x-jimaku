<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />
    <title>x-jimaku M0 Diagnostics</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
      }

      body {
        max-width: 960px;
        margin: 0 auto;
        padding: 24px;
        line-height: 1.5;
      }

      h1,
      h2 {
        line-height: 1.25;
      }

      section {
        margin-block: 28px;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
      }

      button {
        padding: 10px 14px;
        border: 1px solid currentColor;
        border-radius: 6px;
        font: inherit;
        cursor: pointer;
      }

      button:disabled {
        cursor: wait;
        opacity: 0.65;
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      th,
      td {
        padding: 8px 10px;
        border: 1px solid color-mix(in srgb, currentColor 25%, transparent);
        text-align: left;
        vertical-align: top;
      }

      th {
        width: 240px;
      }

      td {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }

      #status {
        min-height: 1.5em;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>x-jimaku M0 Diagnostics</h1>
      <p>
        WebGPUとChrome Translator APIの実行コンテキスト別診断です。
      </p>

      <p id="status" role="status" aria-live="polite"></p>

      <section>
        <h2>操作</h2>
        <div class="actions">
          <button id="run-translator" type="button">
            Run Translator availability probe
          </button>
          <button id="fetch-last" type="button">
            Fetch last offscreen probe results
          </button>
        </div>
      </section>

      <section>
        <h2>環境</h2>
        <table>
          <tbody id="environment-results"></tbody>
        </table>
      </section>

      <section>
        <h2>Options page WebGPU</h2>
        <table>
          <tbody id="webgpu-results"></tbody>
        </table>
      </section>

      <section>
        <h2>Options page Translator</h2>
        <table>
          <tbody id="translator-results"></tbody>
        </table>
      </section>

      <section>
        <h2>保存済みプローブ結果</h2>
        <table>
          <tbody id="stored-results"></tbody>
        </table>
      </section>
    </main>

    <script
      type="module"
      src="/src/options/index.ts"
    ></script>
  </body>
</html>
